name: Desktop

# No upstream workflow builds the desktop target. Leaves the Android workflows alone.
on:
  push:
    # Every desktop working branch. The series moved from desktop-linux-windows to
    # desktop-rebase, and the ten commits carrying the whole UI were never built
    # because the trigger still named the old branch only.
    branches: ["desktop-*"]
    tags: ["v*"]
  pull_request:
    branches: ["desktop-*"]
  workflow_dispatch:

jobs:
  package:
    strategy:
      # A Windows failure must not cancel the Linux packages already building, and vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            tasks: ":composeApp:packageDeb :composeApp:packageRpm"
          - os: windows-latest
            name: windows
            tasks: ":composeApp:packageMsi"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # packageRpm shells out to rpmbuild, which ubuntu runners do not ship.
      - name: Install rpmbuild
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # On a v1.2.3 tag the package must carry 1.2.3, not the gradle.properties value.
      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "RIPLAY_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build packages
        shell: bash
        run: |
          ./gradlew ${{ matrix.tasks }} --no-daemon \
            ${RIPLAY_VERSION:+-PriplayVersion=$RIPLAY_VERSION}

      # The job would pass with zero files if a task silently stopped emitting its package.
      # Writes to a file rather than `tee /dev/stderr`, which Git Bash on Windows does not have —
      # and which fails the whole pipeline under `pipefail`, masking whatever was really produced.
      - name: Check a package was produced
        shell: bash
        run: |
          find composeApp/build/compose/binaries -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' \) > packages.txt
          cat packages.txt
          test -s packages.txt || { echo "No package produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: riplay-desktop-${{ matrix.name }}
          path: |
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/rpm/*.rpm
            composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
