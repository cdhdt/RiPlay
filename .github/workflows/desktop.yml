name: Desktop

# No upstream workflow builds the desktop target. Leaves the Android workflows alone.
on:
  push:
    # Every desktop working branch. The series moved from desktop-linux-windows to
    # desktop-rebase, and the ten commits carrying the whole UI were never built
    # because the trigger still named the old branch only.
    branches: ["desktop-*"]
    tags: ["v*"]
  pull_request:
    branches: ["desktop-*"]
  workflow_dispatch:

jobs:
  package:
    strategy:
      # A Windows failure must not cancel the Linux packages already building, and vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            tasks: ":composeApp:packageDeb :composeApp:packageRpm"
          - os: windows-latest
            name: windows
            tasks: ":composeApp:packageMsi"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # packageRpm shells out to rpmbuild, which ubuntu runners do not ship.
      - name: Install rpmbuild
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # On a v1.2.3 tag the package must carry 1.2.3, not the gradle.properties value.
      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "RIPLAY_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build packages
        shell: bash
        run: |
          ./gradlew ${{ matrix.tasks }} --no-daemon \
            ${RIPLAY_VERSION:+-PriplayVersion=$RIPLAY_VERSION}

      # The job would pass with zero files if a task silently stopped emitting its package.
      # Writes to a file rather than `tee /dev/stderr`, which Git Bash on Windows does not have —
      # and which fails the whole pipeline under `pipefail`, masking whatever was really produced.
      - name: Check a package was produced
        shell: bash
        run: |
          find composeApp/build/compose/binaries -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' \) > packages.txt
          cat packages.txt
          test -s packages.txt || { echo "No package produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: riplay-desktop-${{ matrix.name }}
          path: |
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/rpm/*.rpm
            composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  # The packages existed only as 90-day build artifacts, which is why the README's
  # "download from the latest release" line has nothing to point at for desktop.
  # On a v* tag they now land on the release itself.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Collect the packages built by both jobs
        uses: actions/download-artifact@v4
        with:
          pattern: riplay-desktop-*
          path: packages
          merge-multiple: true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find packages -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.msi' \) > assets.txt
          cat assets.txt
          test -s assets.txt || { echo "Nothing to publish"; exit 1; }
          # Create the release only if it is absent: on a tag the Android workflow
          # may have published it first, and its notes must survive.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --notes "Desktop packages for $GITHUB_REF_NAME."
          # --clobber so a re-run replaces the assets instead of failing on a name
          # that already exists.
          xargs -a assets.txt gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --clobber
